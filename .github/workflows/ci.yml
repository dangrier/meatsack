name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # package.json promises node >=20.
        node: [20, 22, 24]
        include:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # tsc is the typecheck.
      - run: npm run build

      # The plain-JS files tsc never sees.
      - name: Syntax-check public/ and scripts/
        run: |
          for f in public/*.js scripts/*.mjs; do
            node --check "$f"
          done

      - name: Smoke test
        run: npm run smoke
        env:
          MEATSACK_OPEN: '0'

      - name: Package contents
        run: npm pack --dry-run
